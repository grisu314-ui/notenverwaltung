# Variante MIT Build-Schritt: baut und startet in einem Zug.
#
#   docker compose build && docker compose up -d
#
# Zum Erzeugen des produktiven Images wird diese Datei NICHT gebraucht:
# `docker build -t notenverwaltung:TAG .` liest allein das Dockerfile. Der
# Weg auf dem NAS ist genau der -- gebaut wird in der Shell, gefahren wird
# der Stack aus docker-compose.truenas.yml, in dem `image:` statt `build:`
# steht. Anleitung: docs/inbetriebnahme-truenas.md
#
# Diese Datei bleibt als bequemer Ein-Befehl-Weg für einen zweiten Rechner
# oder einen Teststand.
#
# Aufbau (Spezifikation 2), drei Container:
#
#   Tailnet ──► tailscale + pforte (ein Netz-Namespace)   Caddy :8000, Basic Auth
#                     │
#                     ▼  Netz „intern" (internal: true)
#               notenverwaltung :8000
#
# - `tailscale` ist ein eigener Knoten im Tailnet. Nur er hat eine Verbindung
#   nach draußen (Netz `default`), weil Tailscale sie selbst braucht.
# - `pforte` (Caddy) hängt im Netz-Namespace des Sidecars und verlangt Benutzer
#   und Passwort, bevor sie an die Anwendung weiterreicht.
# - `notenverwaltung` hängt NUR im Netz `intern`. Aus dem Tailnet ist sie
#   ausschließlich über die Pforte erreichbar, und nach draußen kommt sie
#   nicht: `internal: true` gibt dem Netz keinen Ausgang.
#
# KEIN ports-Eintrag, an keinem Service. Ein `ports:` am tailscale- oder
# pforte-Service würde die Anwendung im LAN öffnen -- niemals hinzufügen.
#
# Ein eigener Knoten statt des vorhandenen Tailscale-Containers hat einen
# praktischen Vorteil: In den Tailscale-ACLs lässt sich dann genau für diesen
# Knoten festlegen, welche Geräte ihn erreichen dürfen.
#
# Vor dem ersten Start anzupassen:
#   - die beiden Pfade unter volumes. Eingetragen sind die des NAS; auf einem
#     anderen Rechner zeigen sie woanders hin.
#   - eine .env-Datei neben dieser Datei mit TS_AUTHKEY, PFORTE_USER und
#     PFORTE_HASH. Vorlage: .env.example. Die .env gehört nicht ins
#     Repository; .gitignore deckt sie ab.
#   - das Tailscale-Image festnageln, sobald der Stack einmal lief:
#       docker exec notenverwaltung-tailscale tailscale version | head -1

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: notenverwaltung-tailscale
    hostname: notenverwaltung
    environment:
      # Der Schlüssel gehört Ihrer Infrastruktur, nicht der Anwendung.
      # Die Anwendung selbst hat kein einziges Geheimnis.
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY fehlt - bitte in .env eintragen}
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: notenverwaltung
    volumes:
      - tailscale-zustand:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # default: der Weg ins Internet, den nur Tailscale selbst braucht.
    # intern:  der Weg zur Anwendung, den die Pforte über diesen Namespace nimmt.
    networks:
      - default
      - intern
    restart: unless-stopped

  pforte:
    # Feste Version, nicht latest: Die Pforte ist der Zugangsschutz, sie
    # tauscht sich nicht unbemerkt aus.
    image: caddy:2.11.4-alpine
    container_name: notenverwaltung-pforte
    # Im Netz des Sidecars: Caddy lauscht dort auf Port 8000 und ist damit
    # unter http://notenverwaltung:8000 im Tailnet erreichbar -- dieselbe
    # Adresse wie vorher. Kein ports-Eintrag und keiner möglich.
    network_mode: service:tailscale
    volumes:
      # Der Ordner, nicht die einzelne Datei (Empfehlung der Image-Doku).
      - ./caddy:/etc/caddy:ro
      - caddy-daten:/data
      - caddy-config:/config
    environment:
      # Beides aus der .env. Der Hash enthält `$`: in der .env in EINFACHE
      # Anführungszeichen setzen, sonst ersetzt Compose Teile davon.
      PFORTE_USER: ${PFORTE_USER:?PFORTE_USER fehlt - bitte in .env eintragen}
      PFORTE_HASH: ${PFORTE_HASH:?PFORTE_HASH fehlt - bitte in .env eintragen}
    depends_on:
      - tailscale
      - notenverwaltung
    restart: unless-stopped

  notenverwaltung:
    build: .
    container_name: notenverwaltung
    # Nur im internen Netz. Der Alias ist der Name, unter dem die Pforte die
    # Anwendung anspricht (caddy/Caddyfile) -- warum nicht `notenverwaltung`,
    # steht dort.
    networks:
      intern:
        aliases:
          - anwendung
    volumes:
      # Die SQLite-Datei gehört auf ein lokales Dataset, niemals auf eine
      # SMB- oder NFS-Freigabe (Spezifikation 2, Punkt 2).
      - /mnt/Daten-Z1/apps/notenverwaltung/daten:/daten
      # Getrenntes Ziel, damit es auf ein Snapshot-Dataset zeigen kann.
      - /mnt/Daten-Z1/apps/notenverwaltung/sicherungen:/sicherungen
    restart: unless-stopped

networks:
  # Ohne Ausgang: Die Anwendung baut keine Verbindung nach draußen auf
  # (Spezifikation 2, Punkt 7), und hier kann sie es auch nicht.
  intern:
    internal: true

volumes:
  tailscale-zustand:
  caddy-daten:
  caddy-config:
