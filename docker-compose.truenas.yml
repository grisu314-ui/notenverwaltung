# Variante für TrueNAS SCALE mit Dockge.
# Anleitung: docs/inbetriebnahme-truenas.md
#
# Unterschied zur docker-compose.yml: kein Build-Schritt. Gebaut wird vorher
# in der Shell (Anleitung, Schritt 3), hier läuft nur noch das fertige
# Image. Dockge startet und stoppt den Stack, mehr nicht.
#
# Alle drei Volumes sind absolute Pfade auf dem NAS -- keine benannten
# Docker-Volumes. Damit liegt jeder Zustand des Stacks an einer Stelle, die
# man sehen, sichern und in einen Snapshot nehmen kann.
#
# Vor dem ersten Start sind genau zwei Werte einzutragen:
#   1. VERSION beim Tailscale-Image
#   2. der Tag des gebauten Images bei `notenverwaltung:`
# Dazu die Datei .env im Stack-Verzeichnis mit TS_AUTHKEY.

services:
  tailscale:
    # Beim ersten Mal `latest` eintragen -- das laeuft. Danach die Version
    # festnageln, damit sich der Sidecar nicht unbemerkt austauscht:
    #   docker exec notenverwaltung-tailscale tailscale version | head -1
    # und daraus z. B. tailscale/tailscale:v1.90.2 machen.
    #
    # Eine geratene Nummer ist gefaehrlich: Dieser Aufbau setzt voraus, dass
    # das Image von selbst startet und TS_AUTHKEY auswertet (Programm
    # `containerboot`). Aeltere Images fuehren nur /bin/sh aus, das sofort
    # endet -- der Stack laeuft dann nie an.
    image: tailscale/tailscale:VERSION
    container_name: notenverwaltung-tailscale
    hostname: notenverwaltung
    environment:
      # Der Schlüssel gehört Ihrer Infrastruktur, nicht der Anwendung.
      # Die Anwendung selbst hat kein einziges Geheimnis.
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY fehlt - bitte in .env eintragen}
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: notenverwaltung
    volumes:
      # Der Knotenzustand. Bleibt er erhalten, wird der Auth-Key nur beim
      # allerersten Start gebraucht. Dieses Verzeichnis gehört root, NICHT
      # 1000: tailscaled läuft im Container als root.
      - /mnt/Daten-Z1/apps/notenverwaltung/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  notenverwaltung:
    # Der Tag aus dem Build-Schritt, Datum statt latest: er ist gleichzeitig
    # die Rollback-Marke.
    image: notenverwaltung:JJJJ-MM-TT
    # Ohne diese Zeile würde Compose bei einem vertippten Tag versuchen, ein
    # fremdes Image gleichen Namens aus dem Netz zu holen. Meldet Ihre
    # Compose-Version die Zeile als unbekannt, kann sie ersatzlos weg --
    # ein lokal vorhandenes Image wird auch ohne sie nicht neu geholt.
    pull_policy: never
    container_name: notenverwaltung
    # Kein ports-Eintrag und keiner möglich: der Container hängt im Netz des
    # Sidecars und ist ausschließlich über den Tailnet-Namen erreichbar.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      # Lokales Dataset, niemals eine SMB- oder NFS-Freigabe
      # (Spezifikation 2, Punkt 2). Gehört UID/GID 1000.
      - /mnt/Daten-Z1/apps/notenverwaltung/daten:/daten
      # Getrenntes Ziel, damit es auf ein Snapshot-Dataset zeigen kann.
      - /mnt/Daten-Z1/apps/notenverwaltung/sicherungen:/sicherungen
    restart: unless-stopped
